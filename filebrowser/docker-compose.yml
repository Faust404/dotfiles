services:
  filebrowser:
    image: hurlenko/filebrowser
    container_name: filebrowser
    networks:
      - caddy
    volumes:
      - $HOME/docker_volumes/foundry_main_data:/data/foundry_main
      - $HOME/docker_volumes/foundry_test_data:/data/foundry_test
      - $HOME/docker_volumes/filebrowser/config/:/config
    environment:
      - FB_BASEURL=/filebrowser
    restart: always

networks:
  caddy:
    name: caddy
    external: true