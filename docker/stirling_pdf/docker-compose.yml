services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: stirling_pdf
    ports:
      - 8080:8080
    networks:
      - caddy
    volumes:
      - $HOME/docker_volumes/StirlingPDF/trainingData:/usr/share/tessdata # Required for extra OCR languages
      - $HOME/docker_volumes/StirlingPDF/extraConfigs:/configs
      - $HOME/docker_volumes/StirlingPDF/customFiles:/customFiles/
      - $HOME/docker_volumes/StirlingPDF/logs:/logs/
      - $HOME/docker_volumes/StirlingPDF/pipeline:/pipeline/
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=en_GB

networks:
  caddy:
    name: caddy
    external: true