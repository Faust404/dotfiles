services:
  mc-server:
    container_name: mc-server
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    # networks:
    #   - caddy
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      MEMORY: 4G
      MOTD: Welcome to the server!
      SEED: 7599824378187852
      DIFFICULTY: NORMAL
      ENFORCE_WHITELIST: "TRUE"
      ONLINE_MODE: "TRUE"
      MAX_PLAYERS: 10
      WHITELIST_FILE: /extra/whitelist.json
      OPS_FILE: /extra/ops.json
      RCON_CMDS_STARTUP: /gamerule keepInventory true
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_ALLOWED_VERSION_TYPE: "alpha"
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        ferrite-core
        c2me-fabric
        modernfix
        appleskin
        sleep
    volumes:
      - $HOME/docker_volumes/minecraft/data:/data
      - $HOME/docker_volumes/minecraft/mods:/data/mods
      - $HOME/docker_volumes/minecraft/extra:/extra

