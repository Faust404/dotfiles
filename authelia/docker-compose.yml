services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    depends_on:
      - redis
      # - database
    networks:
      - caddy
    volumes:
      - $HOME/docker_volumes/authelia/config:/config
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/JWT_SECRET
      AUTHELIA_SESSION_SECRET_FILE: /config/secrets/SESSION_SECRET
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/STORAGE_ENCRYPTION_KEY
      # AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /config/secrets/STORAGE_PASSWORD
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /config/secrets/REDIS_PASSWORD
      # AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /config/secrets/SMTP_PASSWORD

  # database:
  #   image: postgres
  #   container_name: postgres_authelia
  #   restart: unless-stopped
  #   # networks:
  #   #   - caddy
  #   volumes:
  #     - $HOME/docker_volumes/authelia/postgres:/var/lib/postgresql/data
  #   environment:
  #     POSTGRES_USER: "authelia"
  #     POSTGRES_PASSWORD: "[sBF8KbRdXjAnUmoETTSyEGH1lyxIHi9G8R7JetemNSQrBYmAlP54WwmunOEJ3z7t]"

  redis:
    image: redis:alpine
    container_name: redis_authelia
    restart: unless-stopped
    networks:
      - caddy
    volumes:
      - $HOME/docker_volumes/authelia/redis:/data

networks:
  caddy:
    name: caddy
    external: true